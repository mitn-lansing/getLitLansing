            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0.85rem 1.6rem;
            font-family: var(--display);
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 999px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn-primary {
            background: var(--filament);
            color: #fff;
            box-shadow: 0 8px 24px rgba(255, 92, 42, 0.28);
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255, 92, 42, 0.4); }

        .btn-ghost { background: transparent; color: var(--window); border: 1px solid var(--line); }
        .btn-ghost:hover { background: var(--glass); transform: translateY(-2px); }

        @media (prefers-reduced-motion: reduce) {
